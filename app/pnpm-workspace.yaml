packages:
  - apps/*
  - packages/*
# pnpm 12 refuses to install while a build script is unreviewed: the one policy for every workspace member.
# One version of the dev tools every workspace member shares (`"catalog:"` in its package.json): one bump here, not fifteen edits.
catalog:
  typescript: 6.0.3
  vitest: 5.1.0
  '@types/node': 22.20.5
  tsx: 4.23.15
allowBuilds:
  esbuild: true
  # P49: the terminal's PTY. Its install script only picks the shipped prebuilt (darwin-arm64); node-gyp is the fallback.
  node-pty: true
  # P71 M1: reviewed and refused. `@mtcute/node` depends on better-sqlite3 12, but the hub runs mtcute on MemoryStorage and never
  # loads that addon, so its install script (prebuild-install or node-gyp) is not run. `@hub/db`'s 13.1.1 has no install script.
  better-sqlite3: false
  # P71 M5: reviewed and refused. Baileys' preinstall only checks the Node version (engine-requirements.js; the hub needs Node 22
  # anyway); protobufjs' postinstall only checks its optional CLI's peers. Neither builds anything the hub loads.
  baileys: false
  protobufjs: false
minimumReleaseAgeExclude:
  - lucide-react@1.73.0
  - '@playwright/test@1.65.1'
  - playwright-core@1.65.1
  - playwright@1.65.1
